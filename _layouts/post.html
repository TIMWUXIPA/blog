---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.category | default: '手记' }} / <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <a class="back" href="{{ '/' | relative_url }}"><span data-i18n="backnotes">← 返回全部手记</span></a>
</article>
